  {
    "id": "CASE-022",
    "skill": "production-trading-operations",
    "kind": "boundary",
    "prompt": "A trading process restarted after a disconnect. Its local open-order cache is empty. Should the strategy automatically resume without querying the venue?",
    "expected_behaviors": [
      "Requires reconciliation with authoritative venue/broker order and position state.",
      "Keeps risk-increasing flow disabled until data, risk, sessions, and order state are verified.",
